name: Upstox option chain (end-of-day)
on:
  schedule:
    - cron: "0 11 * * 1-5"     # 16:30 IST weekdays, after the close
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: upstox-options
  cancel-in-progress: false
jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save the option chains (Nifty, Bank Nifty, Fin Nifty, Midcap Nifty)
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python upstox_options.py snapshot
      - name: Commit (retries if another job pushed first)
        if: always()
        run: |
          git config user.name  "upstox"
          git config user.email "upstox@users.noreply.github.com"
          git add options upstox/options_report.json
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -q -m "Option chains $(date -u +%F)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs --autostash -q && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $i failed; trying again in $((i*10))s"; sleep $((i*10))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 5 tries"; exit 1; }
          fi
