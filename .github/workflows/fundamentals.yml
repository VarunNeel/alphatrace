name: Fundamentals (classification + float)
on:
  schedule:
    - cron: "0 2 1 * *"        # 07:30 IST on the 1st of every month
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fundamentals
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q --retries 5 --timeout 60 yfinance
      - name: Reuse earlier BSE / Yahoo replies
        uses: actions/cache@v4
        with:
          path: fundamentals/cache
          key: fundamentals-cache-${{ github.run_id }}
          restore-keys: fundamentals-cache-
      - name: Build nse_classification.csv, STOCKS_FLOAT.csv, universe.csv
        run: python fundamentals.py run --stocks stocks.csv --eod eod
      - name: Commit results (retries if another job pushed first)
        if: always()
        run: |
          git config user.name  "fundamentals"
          git config user.email "fundamentals@users.noreply.github.com"
          git add fundamentals/*.csv
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -q -m "Fundamentals $(date -u +%F)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $i failed (another job pushed first?); trying again in $((i*10))s"; sleep $((i*10))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 5 tries"; exit 1; }
          fi
