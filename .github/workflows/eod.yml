name: Daily EOD feed
# Runs every day at 17:00, 19:00, 21:00 and 23:00 IST (GitHub schedules are in UTC; IST = UTC + 5:30). GitHub can start a run a few minutes
# late or, rarely, skip one, so four slots a day keep the feed current. A slot that finds nothing new simply does nothing.
on:
  schedule:
    - cron: "30 11 * * *"     # 17:00 IST, every day
    - cron: "30 13 * * *"     # 19:00 IST
    - cron: "30 15 * * *"     # 21:00 IST
    - cron: "30 17 * * *"     # 23:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: eod-feed
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy (3 tries; holidays just have no file)
        run: |
          ok=0
          for i in $(seq 1 3); do
            if python fetch_eod.py --days 7; then ok=1; break; fi
            echo "Attempt $i of 3 failed; waiting $((i*45))s"; sleep $((i*45))
          done
          [ "$ok" = 1 ] || echo "::warning::the NSE download failed 3 times; the next scheduled run will try again"
      - name: Commit new days (retries if another job pushed first)
        if: always()
        run: |
          git config user.name  "eod-feed"
          git config user.email "eod-feed@users.noreply.github.com"
          git add eod
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -q -m "EOD $(date -u +%F)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $i failed (another job pushed first?); trying again in $((i*10))s"; sleep $((i*10))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 5 tries"; exit 1; }
          fi
      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without a commit)
        if: always()
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt $((40*86400)) ]; then
            git config user.name  "eod-feed"; git config user.email "eod-feed@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive" && git pull --rebase --autostash -q && git push -q || true
          fi
