name: Intraday bars (Yahoo)
# Evening pass on the main branch (kept history): 15-minute bars for the last 2 trading days and 5-minute bars for the last 5 days.
# No 1-hour job: the app builds 1h (and 30m, 2h, 4h…) candles from the 15-minute bars.
# The every-15-minutes job during market hours is intraday_live.yml (publishes to the 'live' branch).
on:
  schedule:
    - cron: "45 10 * * 1-5"    # 16:15 IST weekdays, after the close
    - cron: "0 13 * * 1-5"     # 18:30 IST — second pass in case Yahoo was late
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days for 5m (first run: 59 for a 5m/15m back-fill)"
        default: "5"
      intervals:
        description: "Intervals"
        default: "5m,15m"
      last:
        description: "Newest trading days per interval (empty = use days)"
        default: "15m=2"
permissions:
  contents: write
concurrency:
  group: intraday
  cancel-in-progress: false
jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q --retries 5 --timeout 60 yfinance
      - name: Download intraday bars (3 tries)
        run: |
          ok=0
          for i in $(seq 1 3); do
            if python intraday.py fetch --days "${{ github.event.inputs.days || '5' }}" --intervals "${{ github.event.inputs.intervals || '5m,15m' }}" --last "${{ github.event.inputs.last || '15m=2' }}"; then ok=1; break; fi
            echo "Attempt $i of 3 failed; waiting $((i*60))s"; sleep $((i*60))
          done
          [ "$ok" = 1 ] || echo "::warning::the intraday download failed 3 times; the next scheduled run will try again"
      - name: Commit (retries if another job pushed first)
        if: always()
        run: |
          git config user.name  "ohlcv"
          git config user.email "ohlcv@users.noreply.github.com"
          git add intraday
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -q -m "Intraday $(date -u +%F)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $i failed (another job pushed first?); trying again in $((i*10))s"; sleep $((i*10))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 5 tries"; exit 1; }
          fi
