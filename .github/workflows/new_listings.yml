name: New listings (IPOs)
on:
  schedule:
    - cron: "0 14 * * 1-5"     # 19:30 IST, weekdays
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: newlist
  cancel-in-progress: false
jobs:
  new:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q --retries 5 --timeout 60 yfinance
      - name: Reuse earlier BSE / Yahoo replies
        uses: actions/cache@v4
        with:
          path: fundamentals/cache
          key: fundamentals-cache-${{ github.run_id }}
          restore-keys: fundamentals-cache-
      - name: New symbols on NSE -> stocks.csv
        run: python new_listings.py sync --stocks stocks.csv
      - name: Full price history of recent listings
        run: python new_listings.py backfill --stocks stocks.csv
      - name: Classification + float for them (cached, so only the new ones are fetched)
        run: python fundamentals.py run --stocks stocks.csv --eod eod
      - name: Make sure fresh IPOs are on the stock list even if BSE has not classified them yet
        run: python new_listings.py universe
      - name: Commit (retries if another job pushed first)
        if: always()
        run: |
          git config user.name  "newlist"
          git config user.email "newlist@users.noreply.github.com"
          git add stocks.csv ohlcv/new fundamentals/*.csv
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -q -m "New listings $(date -u +%F)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -q && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $i failed (another job pushed first?); trying again in $((i*10))s"; sleep $((i*10))
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 5 tries"; exit 1; }
          fi
